name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            echo "CC=gcc" >> $GITHUB_ENV
            echo "CXX=g++" >> $GITHUB_ENV
          fi

      - name: Install clang (if needed)
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build formatter_lib
        run: cd formatter_lib && cmake -S . -B _build && cmake --build _build

      - name: Build formatter_ex_lib
        run: cd formatter_ex_lib && cmake -S . -B _build && cmake --build _build

      - name: Build and run hello_world_application
        run: cd hello_world_application && cmake -S . -B _build && cmake --build _build && ./_build/hello_world

      - name: Build solver_lib
        run: cd solver_lib && cmake -S . -B _build && cmake --build _build

      - name: Build and run solver_application
        run: cd solver_application && cmake -S . -B _build && cmake --build _build && ./_build/solver
